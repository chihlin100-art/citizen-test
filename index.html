<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>美國公民「全真考場模擬」口試系統</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #0f172a; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .quiz-container { background-color: #ffffff; color: #333; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); padding: 40px; width: 680px; max-width: 100%; text-align: center; }
        h2 { font-size: 22px; color: #1e3a8a; margin-bottom: 25px; line-height: 1.4; }
        
        .setup-panel { background-color: #f8fafc; border: 2px solid #e2e8f0; padding: 25px; border-radius: 10px; text-align: left; margin-bottom: 20px; color: #1e293b; }
        .setup-panel h3 { margin-top: 0; color: #0f172a; border-bottom: 2px solid #cbd5e1; padding-bottom: 8px; font-size: 18px; }
        
        /* 地址區雙欄佈局 */
        .address-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-bottom: 15px; }
        .form-group { display: flex; flex-direction: column; }
        .form-group.full-width { grid-column: span 2; }
        .form-group label { font-weight: bold; margin-bottom: 6px; font-size: 14px; color: #334155; }
        .form-group input { padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 15px; box-sizing: border-box; width: 100%; }
        
        /* 真人面試官選擇卡片樣式 */
        .officer-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 25px; }
        .officer-card { border: 2px solid #cbd5e1; border-radius: 10px; overflow: hidden; text-align: center; cursor: pointer; transition: all 0.2s; background: white; padding-bottom: 10px; }
        .officer-card:hover { border-color: #3b82f6; transform: translateY(-2px); }
        .officer-card.selected { border-color: #22c55e; background-color: #f0fdf4; box-shadow: 0 0 12px rgba(34,197,94,0.4); }
        .officer-img { width: 100%; height: 135px; object-fit: cover; border-bottom: 1px solid #e2e8f0; }
        .officer-name { font-size: 13px; font-weight: bold; color: #1e293b; margin-top: 8px; }
        .officer-accent { font-size: 11px; color: #64748b; margin-top: 2px; padding: 0 4px; }

        .control-panel { background-color: #f1f5f9; padding: 15px; border-radius: 8px; margin-bottom: 20px; text-align: left; font-size: 14px; color: #475569; }
        .control-panel label { font-weight: bold; display: block; margin-bottom: 5px; }
        .speed-slider { width: 100%; margin-bottom: 5px; }
        .repeat-btn { background-color: #3b82f6; color: white; border: none; padding: 10px 20px; border-radius: 20px; font-size: 14px; cursor: pointer; margin-bottom: 20px; font-weight: bold; }
        .repeat-btn:hover { background-color: #2563eb; }
        .mic-btn { background-color: #ef4444; color: white; border: none; padding: 15px 30px; border-radius: 50px; font-size: 18px; cursor: pointer; font-weight: bold; margin: 15px 0; box-shadow: 0 4px 10px rgba(239,68,68,0.4); transition: all 0.2s; }
        .mic-btn.recording { background-color: #22c55e; box-shadow: 0 4px 10px rgba(34,197,94,0.4); }
        .result-box { padding: 15px; border-radius: 8px; margin: 15px 0; font-size: 16px; font-weight: bold; display: none; }
        .success { background-color: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
        .error { background-color: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
        .action-btn { background-color: #1e293b; color: white; border: none; padding: 12px 30px; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold; margin-top: 15px; display: none; }
        .restart-btn { background-color: #22c55e; color: white; border: none; padding: 12px 30px; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold; margin-top: 20px; }
        .restart-btn:hover { background-color: #16a34a; }
    </style>
</head>
<body>

<div class="quiz-container">
    <div id="setup-section" class="setup-panel">
        <h3>考前環境與基本資料設定</h3>
        
        <label style="font-weight: bold; display: block; margin-bottom: 10px; font-size: 14px; color: #334155;">選擇你的指定面試官 (Select Your Interviewer)：</label>
        <div class="officer-grid">
            <div class="officer-card selected" onclick="selectOfficer('white-female', this)">
                <img src="https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&q=80&w=400" class="officer-img" alt="Officer Emily">
                <div class="officer-name">Officer Emily</div>
                <div class="officer-accent">白人女性 (美式標準音)</div>
            </div>
            <div class="officer-card" onclick="selectOfficer('black-male', this)">
                <img src="https://images.unsplash.com/photo-1560250097-0b93528c311a?auto=format&fit=crop&q=80&w=400" class="officer-img" alt="Officer Marcus">
                <div class="officer-name">Officer Marcus</div>
                <div class="officer-accent">黑人男性 (美東渾厚音)</div>
            </div>
            <div class="officer-card" onclick="selectOfficer('indian-female', this)">
                <img src="https://images.unsplash.com/photo-1580894732444-8fecef2600da?auto=format&fit=crop&q=80&w=400" class="officer-img" alt="Officer Sofia">
                <div class="officer-name">Officer Sofia</div>
                <div class="officer-accent">印度裔女性 (新移民捲舌)</div>
            </div>
            <div class="officer-card" onclick="selectOfficer('latino-male', this)">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=400" class="officer-img" alt="Officer Diego">
                <div class="officer-name">Officer Diego</div>
                <div class="officer-accent">南美洲男性 (西語平舌音)</div>
            </div>
        </div>

        <label style="font-weight: bold; display: block; margin-bottom: 10px; font-size: 14px; color: #0f172a; border-top: 1px solid #cbd5e1; padding-top: 15px;">應試者通訊資料 (Applicant Information)：</label>
        <div class="address-grid">
            <div class="form-group full-width">
                <label>姓名 (Full Name)：</label>
                <input type="text" id="setup-name" value="Jeffrey">
            </div>
            <div class="form-group full-width">
                <label>地址 (Street Address)：</label>
                <input type="text" id="setup-address" value="120 Bellevue Ave">
            </div>
            <div class="form-group">
                <label>城市 (City)：</label>
                <input type="text" id="setup-city" value="Cary">
            </div>
            <div class="form-group">
                <label>州 (State)：</label>
                <input type="text" id="setup-state" value="North Carolina">
            </div>
            <div class="form-group full-width">
                <label>ZIP Code：</label>
                <input type="text" id="setup-zip" value="27511">
            </div>
        </div>
        
        <button class="start-exam-btn" onclick="confirmSetupAndStart()">確認資料，開始模擬面試 🚀</button>
    </div>

    <div id="quiz-section" style="display: none;">
        <div id="progress" style="font-size: 14px; color: #64748b; text-align: left; margin-bottom: 10px;"></div>
        
        <div class="control-panel">
            <div id="current-officer-display" style="font-weight: bold; color: #1e3a8a; margin-bottom: 8px; font-size: 15px;"></div>
            <label for="speed">官員語速調整 (Speech Speed): <span id="speed-val">0.85</span>x</label>
            <input type="range" id="speed" class="speed-slider" min="0.5" max="1.2" step="0.05" value="0.85" oninput="updateSpeed(this.value)">
        </div>

        <button class="repeat-btn" onclick="speakQuestion(true)">
            🙋‍♂️ 沒聽清？請官員再唸一次 (Can you please repeat that?)
        </button>
        
        <h2 id="question-text">題目載入中...</h2>
        
        <button id="mic-btn" class="mic-btn" onclick="toggleListening()">🎤 按一下開始回答 (Speak Now)</button>
        
        <div id="user-speech" style="font-style: italic; color: #475569; margin: 10px 0; min-height: 24px;"></div>
        <div id="similarity-score" style="font-size: 13px; color: #64748b; margin-bottom: 10px;"></div>
        
        <div id="result-box" class="result-box"></div>
        
        <div style="margin-top: 15px;">
            <button id="next-btn" class="action-btn" onclick="nextQuestion()">下一題 (Next)</button>
        </div>
    </div>
    
    <div id="final-section" style="display: none; color: #333;">
        <h2>測驗結束！</h2>
        <p style="font-size: 18px;">順利通過題數：<span id="final-score" style="color: #22c55e; font-weight: bold;">0</span> / <span id="total-questions">0</span></p>
        <button class="restart-btn" onclick="restartQuiz()">🔄 再試一次 (Restart)</button>
    </div>
</div>

<script>
    // 核心題庫：整合基本憲法題與自動判定的總統政治題
    const rawQuizData = [
      { id: 1, question: "What is the supreme law of the land?", keywords: ["constitution"], answer: "The Constitution" },
      { id: 2, question: "What does the Constitution do?", keywords: ["sets up", "defines", "protects"], answer: "sets up the government / defines the government / protects basic rights of Americans" },
      { id: 3, question: "The idea of self-government is in the first three words of the Constitution. What are these words?", keywords: ["we the people"], answer: "We the People" },
      { id: 4, question: "What is an amendment?", keywords: ["change", "addition"], answer: "a change (to the Constitution) / an addition (to the Constitution)" },
      { id: 5, question: "What do we call the first ten amendments to the Constitution?", keywords: ["bill of rights"], answer: "the Bill of Rights" },
      { id: 6, question: "What is one right or freedom from the First Amendment?", keywords: ["speech", "religion", "assembly", "press", "petition"], answer: "Speech / Religion / Assembly / Press / Petition the government" },
      { id: 7, question: "How many amendments does the Constitution have?", keywords: ["27", "twenty-seven"], answer: "27" },
      { id: 8, question: "What did the Declaration of Independence do?", keywords: ["announced", "declared", "said"], answer: "announced our independence (from Great Britain) / declared our independence / said that the United States is free" },
      { id: 9, question: "What are two rights in the Declaration of Independence?", keywords: ["life", "liberty", "pursuit of happiness"], answer: "Life / Liberty / Pursuit of happiness" },
      { id: 10, question: "What is freedom of religion?", keywords: ["any religion", "not practice"], answer: "You can practice any religion, or not practice a religion." },
      
      // 時間自動變動題 (中央執政團隊數據)
      { id: 46, isDynamic: "party", question: "What is the political party of the President now?", keywords: [], answer: "" },
      { id: 47, isDynamic: "president", question: "What is the name of the President of the United States now?", keywords: [], answer: "" },
      { id: 48, isDynamic: "vp", question: "What is the name of the Vice President of the United States now?", keywords: [], answer: "" },

      { id: 11, question: "What is the economic system in the United States?", keywords: ["capitalist", "market"], answer: "capitalist economy / market economy" },
      { id: 12, question: "What is the rule of law?", keywords: ["everyone must follow", "no one is above"], answer: "Everyone must follow the law / Leaders must obey the law / Government must obey the law / No one is above the law" }
    ];

    let quizData = [];
    let currentQuestionIndex = 0;
    let score = 0;
    let recognition;
    let isRecording = false;
    let currentSpeed = 0.85;
    let lastRoundFinalQuestionId = null;

    let selectedOfficerType = 'white-female';
    const officerMeta = {
        'white-female': { name: "Officer Emily (白人女性)", lang: "en-US", nameHint: "Zira" },
        'black-male': { name: "Officer Marcus (黑人男性)", lang: "en-US", nameHint: "David" },
        'indian-female': { name: "Officer Sofia (印度裔女性)", lang: "en-IN", nameHint: "Heera" },
        'latino-male': { name: "Officer Diego (南美洲男性)", lang: "en-ZA", nameHint: "Sabina" }
    };

    // 背景靜態與動態變量定義
    let dynamicPresident = "Donald Trump";
    let dynamicVP = "JD Vance";
    let dynamicParty = "Republican Party";

    function selectOfficer(type, element) {
        selectedOfficerType = type;
        document.querySelectorAll('.officer-card').forEach(card => card.classList.remove('selected'));
        element.classList.add('selected');
    }

    // 後台全自動時間沙盒校準
    function autoDetectPresidentialData() {
        const now = new Date();
        const year = now.getFullYear();
        const month = now.getMonth() + 1;
        const day = now.getDate();

        let isTrumpEra = (year > 2025) || (year === 2025 && (month > 1 || (month === 1 && day >= 20)));

        if (isTrumpEra) {
            dynamicPresident = "Donald Trump"; dynamicVP = "JD Vance"; dynamicParty = "Republican Party";
        } else {
            dynamicPresident = "Joe Biden"; dynamicVP = "Kamala Harris"; dynamicParty = "Democratic Party";
        }
    }

    function confirmSetupAndStart() {
        // 後台自動對齊背景語音關鍵字
        rawQuizData.forEach(q => {
            if (q.isDynamic === "president") { q.answer = dynamicPresident; q.keywords = dynamicPresident.toLowerCase().split(" "); }
            else if (q.isDynamic === "vp") { q.answer = dynamicVP; q.keywords = dynamicVP.toLowerCase().split(" "); }
            else if (q.isDynamic === "party") { q.answer = dynamicParty; q.keywords = dynamicParty.toLowerCase().split(" "); }
        });

        document.getElementById("current-officer-display").innerText = `當前面試官：${officerMeta[selectedOfficerType].name}`;
        document.getElementById("setup-section").style.display = "none";
        document.getElementById("quiz-section").style.display = "block";
        startNewQuizSession();
    }

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function generateSmartQuiz() {
        let pool = [...rawQuizData];
        shuffleArray(pool);
        if (lastRoundFinalQuestionId !== null && pool[0].id === lastRoundFinalQuestionId) {
            [pool[0], pool[pool.length - 1]] = [pool[pool.length - 1], pool[0]];
        }
        quizData = pool.slice(0, 6);
    }

    function updateSpeed(val) {
        currentSpeed = parseFloat(val);
        document.getElementById("speed-val").innerText = val;
    }

    function speakQuestion(isUserRequested = false) {
        window.speechSynthesis.cancel();
        let utterance = new SpeechSynthesisUtterance(quizData[currentQuestionIndex].question);
        
        const config = officerMeta[selectedOfficerType];
        utterance.lang = config.lang;
        
        let voices = window.speechSynthesis.getVoices();
        let matchedVoice = voices.find(v => v.lang.includes(config.lang) && v.name.includes(config.nameHint)) 
                           || voices.find(v => v.lang.includes(config.lang));
        
        if (matchedVoice) { utterance.voice = matchedVoice; }
        
        if (selectedOfficerType === 'indian-female') { utterance.pitch = 1.15; } 
        else if (selectedOfficerType === 'black-male') { utterance.pitch = 0.82; }
        else if (selectedOfficerType === 'latino-male') { utterance.pitch = 0.90; }

        utterance.rate = currentSpeed;
        window.speechSynthesis.speak(utterance);
    }

    function similarity(s1, s2) {
        let longer = s1; let shorter = s2;
        if (s1.length < s2.length) { longer = s2; shorter = s1; }
        let longerLength = longer.length;
        if (longerLength === 0) { return 1.0; }
        return (longerLength - editDistance(longer, shorter)) / parseFloat(longerLength);
    }

    function editDistance(s1, s2) {
        s1 = s1.toLowerCase(); s2 = s2.toLowerCase();
        let costs = new Array();
        for (let i = 0; i <= s1.length; i++) {
            let lastValue = i;
            for (let j = 0; j <= s2.length; j++) {
                if (i == 0) costs[j] = j;
                else {
                    if (j > 0) {
                        let newValue = costs[j - 1];
                        if (s1.charAt(i - 1) != s2.charAt(j - 1))
                            newValue = Math.min(Math.min(newValue, lastValue), costs[j]) + 1;
                        costs[j - 1] = lastValue;
                        lastValue = newValue;
                    }
                }
            }
            if (i > 0) costs[s2.length] = lastValue;
        }
        return costs[s2.length];
    }

    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition();
        recognition.lang = 'en-US';
        recognition.continuous = false;

        recognition.onstart = function() {
            isRecording = true;
            micBtn.innerText = "🛑 官員正在聽... (Listening)";
            micBtn.classList.add("recording");
            userSpeechText.innerText = "請開口回答...";
            resultBox.style.display = "none";
        };
        recognition.onerror = function() { resetMicButton(); };
        recognition.onend = function() { resetMicButton(); };
        recognition.onresult = function(event) {
            const userSpeech = event.results[0][0].transcript.toLowerCase();
            userSpeechText.innerHTML = `你回答的是：<strong>"${userSpeech}"</strong>`;
            checkAnswerWithTolerance(userSpeech);
        };
    }

    const questionText = document.getElementById("question-text");
    const micBtn = document.getElementById("mic-btn");
    const userSpeechText = document.getElementById("user-speech");
    const resultBox = document.getElementById("result-box");
    const nextBtn = document.getElementById("next-btn");
    const progressText = document.getElementById("progress");

    function startNewQuizSession() {
        generateSmartQuiz(); 
        currentQuestionIndex = 0;
        score = 0;
        document.getElementById("quiz-section").style.display = "block";
        document.getElementById("final-section").style.display = "none";
        loadQuestion();
    }

    function loadQuestion() {
        resultBox.style.display = "none"; nextBtn.style.display = "none";
        userSpeechText.innerText = ""; document.getElementById("similarity-score").innerText = "";
        let currentQuestion = quizData[currentQuestionIndex];
        progressText.innerText = `題目進度: ${currentQuestionIndex + 1} / ${quizData.length}`;
        questionText.innerText = currentQuestion.question;
        setTimeout(() => { speakQuestion(false); }, 400);
    }

    function toggleListening() { if (isRecording) { recognition.stop(); } else { recognition.start(); } }
    function resetMicButton() { isRecording = false; micBtn.innerText = "🎤 按一下開始回答 (Speak Now)"; micBtn.classList.remove("recording"); }

    function checkAnswerWithTolerance(speech) {
        let currentQuestion = quizData[currentQuestionIndex];
        let speechWords = speech.split(" ");
        let maxSimilarity = 0;
        for (let word of speechWords) {
            for (let keyword of currentQuestion.keywords) {
                let sim = similarity(word, keyword);
                if (sim > maxSimilarity) { maxSimilarity = sim; }
            }
        }
        let isCorrect = maxSimilarity >= 0.70;
        resultBox.style.display = "block";
        document.getElementById("similarity-score").innerText = `(語音匹配度: ${Math.round(maxSimilarity * 100)}%)`;
        if (isCorrect) {
            resultBox.className = "result-box success";
            resultBox.innerHTML = `⭕ 正確。<br>標準答案：${currentQuestion.answer}`;
            score++;
        } else {
            resultBox.className = "result-box error";
            resultBox.innerHTML = `❌ 錯誤。<br>標準答案應包含：${currentQuestion.answer}`;
        }
        nextBtn.style.display = "inline-block";
    }

    function nextQuestion() {
        lastRoundFinalQuestionId = quizData[currentQuestionIndex].id;
        currentQuestionIndex++;
        if (currentQuestionIndex < quizData.length) { loadQuestion(); } 
        else {
            document.getElementById("quiz-section").style.display = "none";
            document.getElementById("final-section").style.display = "block";
            document.getElementById("final-score").innerText = score;
            document.getElementById("total-questions").innerText = quizData.length;
        }
    }

    function restartQuiz() { startNewQuizSession(); }

    window.onload = function() {
        autoDetectPresidentialData();
        if (typeof speechSynthesis !== 'undefined' && speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = () => {}; 
        }
    };
</script>

</body>
</html>
