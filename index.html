<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>美國公民「全真考場模擬」口試系統</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #0f172a; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .quiz-container { background-color: #ffffff; color: #333; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); padding: 40px; width: 550px; max-width: 90%; text-align: center; }
        h2 { font-size: 22px; color: #1e3a8a; margin-bottom: 25px; line-height: 1.4; }
        .control-panel { background-color: #f1f5f9; padding: 15px; border-radius: 8px; margin-bottom: 20px; text-align: left; font-size: 14px; color: #475569; }
        .control-panel label { font-weight: bold; display: block; margin-bottom: 5px; }
        .speed-slider { width: 100%; margin-bottom: 5px; }
        .repeat-btn { background-color: #3b82f6; color: white; border: none; padding: 10px 20px; border-radius: 20px; font-size: 14px; cursor: pointer; margin-bottom: 20px; font-weight: bold; }
        .repeat-btn:hover { background-color: #2563eb; }
        .mic-btn { background-color: #ef4444; color: white; border: none; padding: 15px 30px; border-radius: 50px; font-size: 18px; cursor: pointer; font-weight: bold; margin: 15px 0; box-shadow: 0 4px 10px rgba(239,68,68,0.4); transition: all 0.2s; }
        .mic-btn.recording { background-color: #22c55e; box-shadow: 0 4px 10px rgba(34,197,94,0.4); }
        .result-box { padding: 15px; border-radius: 8px; margin: 15px 0; font-size: 16px; font-weight: bold; display: none; }
        .success { background-color: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
        .error { background-color: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
        .action-btn { background-color: #1e293b; color: white; border: none; padding: 12px 30px; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold; margin-top: 15px; display: none; }
        .restart-btn { background-color: #22c55e; color: white; border: none; padding: 12px 30px; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold; margin-top: 20px; }
        .restart-btn:hover { background-color: #16a34a; }
    </style>
</head>
<body>

<div class="quiz-container">
    <div id="quiz-section">
        <div id="progress" style="font-size: 14px; color: #64748b; text-align: left; margin-bottom: 10px;"></div>
        
        <div class="control-panel">
            <label for="speed">官員語速調整 (Officer Speech Speed): <span id="speed-val">0.85</span>x</label>
            <input type="range" id="speed" class="speed-slider" min="0.5" max="1.2" step="0.05" value="0.85" oninput="updateSpeed(this.value)">
            <div style="font-size: 11px; color: #94a3b8;">(提示：0.7-0.8 為體貼慢速，1.0 為一般美國人日常正常語速)</div>
        </div>

        <button class="repeat-btn" onclick="speakQuestion(true)">
            🙋‍♂️ 沒聽清？請官員再唸一次 (Can you please repeat that?)
        </button>
        
        <h2 id="question-text">題目載入中...</h2>
        
        <button id="mic-btn" class="mic-btn" onclick="toggleListening()">🎤 按一下開始回答 (Speak Now)</button>
        
        <div id="user-speech" style="font-style: italic; color: #475569; margin: 10px 0; min-height: 24px;"></div>
        <div id="similarity-score" style="font-size: 13px; color: #64748b; margin-bottom: 10px;"></div>
        
        <div id="result-box" class="result-box"></div>
        
        <div style="margin-top: 15px;">
            <button id="next-btn" class="action-btn" onclick="nextQuestion()">下一題 (Next)</button>
        </div>
    </div>
    
    <div id="final-section" style="display: none; color: #333;">
        <h2>測驗結束！</h2>
        <p style="font-size: 18px;">順利通過題數：<span id="final-score" style="color: #22c55e; font-weight: bold;">0</span> / <span id="total-questions">0</span></p>
        <button class="restart-btn" onclick="restartQuiz()">🔄 再試一次 (Restart)</button>
    </div>
</div>

<script>
    // 這裡幫你注入了全套完整的公民測驗題庫結構（展示核心題池，系統會自動在重開時隨機換題）
    const rawQuizData = [
      { id: 1, question: "What is the supreme law of the land?", keywords: ["constitution"], answer: "The Constitution" },
      { id: 2, question: "What does the Constitution do?", keywords: ["sets up", "defines", "protects"], answer: "sets up the government / defines the government / protects basic rights of Americans" },
      { id: 3, question: "The idea of self-government is in the first three words of the Constitution. What are these words?", keywords: ["we the people"], answer: "We the People" },
      { id: 4, question: "What is an amendment?", keywords: ["change", "addition"], answer: "a change (to the Constitution) / an addition (to the Constitution)" },
      { id: 5, question: "What do we call the first ten amendments to the Constitution?", keywords: ["bill of rights"], answer: "the Bill of Rights" },
      { id: 6, question: "What is one right or freedom from the First Amendment?", keywords: ["speech", "religion", "assembly", "press", "petition"], answer: "Speech / Religion / Assembly / Press / Petition the government" },
      { id: 7, question: "How many amendments does the Constitution have?", keywords: ["27", "twenty-seven"], answer: "27" },
      { id: 8, question: "What did the Declaration of Independence do?", keywords: ["announced", "declared", "said"], answer: "announced our independence (from Great Britain) / declared our independence / said that the United States is free" },
      { id: 9, question: "What are two rights in the Declaration of Independence?", keywords: ["life", "liberty", "pursuit of happiness"], answer: "Life / Liberty / Pursuit of happiness" },
      { id: 10, question: "What is freedom of religion?", keywords: ["any religion", "not practice"], answer: "You can practice any religion, or not practice a religion." },
      { id: 11, question: "What is the economic system in the United States?", keywords: ["capitalist", "market"], answer: "capitalist economy / market economy" },
      { id: 12, question: "What is the rule of law?", keywords: ["everyone must follow", "no one is above"], answer: "Everyone must follow the law / Leaders must obey the law / Government must obey the law / No one is above the law" },
      { id: 13, question: "Name one branch or part of the government.", keywords: ["congress", "legislative", "president", "executive", "courts", "judicial"], answer: "Congress / Legislative / President / Executive / The courts / Judicial" },
      { id: 14, question: "What stops one branch of government from becoming too powerful?", keywords: ["checks and balances", "separation of powers"], answer: "checks and balances / separation of powers" },
      { id: 15, question: "Who is in charge of the executive branch?", keywords: ["president"], answer: "the President" },
      { id: 16, question: "Who makes federal laws?", keywords: ["congress", "senate and house", "legislature"], answer: "Congress / Senate and House (of Representatives) / (U.S. or national) legislature" },
      { id: 17, question: "What are the two parts of the U.S. Congress?", keywords: ["senate", "house"], answer: "the Senate and House (of Representatives)" },
      { id: 18, question: "How many U.S. Senators are there?", keywords: ["100", "one hundred"], answer: "100" },
      { id: 19, question: "We elect a U.S. Senator for how many years?", keywords: ["6", "six"], answer: "6" },
      { id: 20, question: "The U.S. House of Representatives has how many voting members?", keywords: ["435", "four hundred thirty-five"], answer: "435" },
      { id: 21, question: "We elect a U.S. Representative for how many years?", keywords: ["2", "two"], answer: "2" },
      { id: 22, question: "Who does a U.S. Senator represent?", keywords: ["all people of the state"], answer: "all people of the state" },
      { id: 23, question: "Why do some states have more Representatives than other states?", keywords: ["population", "more people"], answer: "(because of) the state's population / (because) they have more people / (because) some states have more people" },
      { id: 24, question: "We elect a President for how many years?", keywords: ["4", "four"], answer: "4" },
      { id: 25, question: "In what month do we vote for President?", keywords: ["november"], answer: "November" },
      { id: 26, question: "What is the name of the President of the United States now?", keywords: ["biden", "joe biden"], answer: "Joe Biden" },
      { id: 27, question: "What is the name of the Vice President of the United States now?", keywords: ["harris", "kamala harris"], answer: "Kamala Harris" },
      { id: 28, question: "If the President can no longer serve, who becomes President?", keywords: ["vice president"], answer: "the Vice President" },
      { id: 29, question: "If both the President and the Vice President can no longer serve, who becomes President?", keywords: ["speaker of the house"], answer: "the Speaker of the House" },
      { id: 30, question: "Name one reason the colonists came to America.", keywords: ["freedom", "liberty", "religion", "opportunity"], answer: "Freedom / Political liberty / Religious freedom" }
      // 此處可依此結構自由擴充至 128 題
    ];

    let quizData = [];
    let currentQuestionIndex = 0;
    let score = 0;
    let recognition;
    let isRecording = false;
    let currentSpeed = 0.85;
    let lastRoundFinalQuestionId = null; // 用來記憶跨局最後一題的變數

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function generateSmartQuiz() {
        let pool = [...rawQuizData];
        shuffleArray(pool);

        // 核心機密：如果重開後隨機抽的第一題與上一局的最後一題相同，則強制將其與倒數第一題對調，徹底消除重合
        if (lastRoundFinalQuestionId !== null && pool[0].id === lastRoundFinalQuestionId) {
            [pool[0], pool[pool.length - 1]] = [pool[pool.length - 1], pool[0]];
        }

        // 每次考驗隨機抽出 6 題（現場移民官也是抽問達 10 題，答對 6 題即過關）
        quizData = pool.slice(0, 6);
    }

    function updateSpeed(val) {
        currentSpeed = parseFloat(val);
        document.getElementById("speed-val").innerText = val;
    }

    function similarity(s1, s2) {
        let longer = s1; let shorter = s2;
        if (s1.length < s2.length) { longer = s2; shorter = s1; }
        let longerLength = longer.length;
        if (longerLength === 0) { return 1.0; }
        return (longerLength - editDistance(longer, shorter)) / parseFloat(longerLength);
    }

    function editDistance(s1, s2) {
        s1 = s1.toLowerCase(); s2 = s2.toLowerCase();
        let costs = new Array();
        for (let i = 0; i <= s1.length; i++) {
            let lastValue = i;
            for (let j = 0; j <= s2.length; j++) {
                if (i == 0) costs[j] = j;
                else {
                    if (j > 0) {
                        let newValue = costs[j - 1];
                        if (s1.charAt(i - 1) != s2.charAt(j - 1))
                            newValue = Math.min(Math.min(newValue, lastValue), costs[j]) + 1;
                        costs[j - 1] = lastValue;
                        lastValue = newValue;
                    }
                }
            }
            if (i > 0) costs[s2.length] = lastValue;
        }
        return costs[s2.length];
    }

    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition();
        recognition.lang = 'en-US';
        recognition.continuous = false;

        recognition.onstart = function() {
            isRecording = true;
            micBtn.innerText = "🛑 官員正在聽... (Listening)";
            micBtn.classList.add("recording");
            userSpeechText.innerText = "請開口回答...";
            resultBox.style.display = "none";
        };

        recognition.onerror = function() { resetMicButton(); };
        recognition.onend = function() { resetMicButton(); };

        recognition.onresult = function(event) {
            const userSpeech = event.results[0][0].transcript.toLowerCase();
            userSpeechText.innerHTML = `你回答的是：<strong>"${userSpeech}"</strong>`;
            checkAnswerWithTolerance(userSpeech);
        };
    }

    const questionText = document.getElementById("question-text");
    const micBtn = document.getElementById("mic-btn");
    const userSpeechText = document.getElementById("user-speech");
    const resultBox = document.getElementById("result-box");
    const nextBtn = document.getElementById("next-btn");
    const progressText = document.getElementById("progress");

    function startNewQuizSession() {
        generateSmartQuiz(); 
        currentQuestionIndex = 0;
        score = 0;
        document.getElementById("quiz-section").style.display = "block";
        document.getElementById("final-section").style.display = "none";
        loadQuestion();
    }

    function loadQuestion() {
        resultBox.style.display = "none"; nextBtn.style.display = "none";
        userSpeechText.innerText = ""; document.getElementById("similarity-score").innerText = "";
        
        let currentQuestion = quizData[currentQuestionIndex];
        progressText.innerText = `題目進度: ${currentQuestionIndex + 1} / ${quizData.length}`;
        questionText.innerText = currentQuestion.question;
        
        setTimeout(() => {
            speakQuestion(false);
        }, 300);
    }

    function speakQuestion(isUserRequested = false) {
        window.speechSynthesis.cancel();
        let utterance = new SpeechSynthesisUtterance(quizData[currentQuestionIndex].question);
        utterance.lang = 'en-US';
        utterance.rate = currentSpeed;
        window.speechSynthesis.speak(utterance);

        if (isUserRequested) {
            userSpeechText.innerHTML = "<span style='color: #2563eb;'>💡 實戰提醒：在現場聽不清時，隨時可以禮貌地對移民官說：'Sorry, could you repeat the question, please?'</span>";
        }
    }

    function toggleListening() { if (isRecording) { recognition.stop(); } else { recognition.start(); } }
    function resetMicButton() { isRecording = false; micBtn.innerText = "🎤 按一下開始回答 (Speak Now)"; micBtn.classList.remove("recording"); }

    function checkAnswerWithTolerance(speech) {
        let currentQuestion = quizData[currentQuestionIndex];
        let speechWords = speech.split(" ");
        let maxSimilarity = 0;

        for (let word of speechWords) {
            for (let keyword of currentQuestion.keywords) {
                let sim = similarity(word, keyword);
                if (sim > maxSimilarity) { maxSimilarity = sim; }
            }
        }

        let isCorrect = maxSimilarity >= 0.70;
        resultBox.style.display = "block";
        document.getElementById("similarity-score").innerText = `(語音匹配度: ${Math.round(maxSimilarity * 100)}%)`;

        if (isCorrect) {
            resultBox.className = "result-box success";
            resultBox.innerHTML = `⭕ 官員聽懂了！正確。<br>標準答案：${currentQuestion.answer}`;
            score++;
        } else {
            resultBox.className = "result-box error";
            resultBox.innerHTML = `❌ 官員露出困惑表情。你可以再聽一次或查看答案。<br>標準答案應包含：${currentQuestion.answer}`;
        }
        nextBtn.style.display = "inline-block";
    }

    function nextQuestion() {
        // 在切換至下一題前，確實將當前題目儲存至跨局變數中
        lastRoundFinalQuestionId = quizData[currentQuestionIndex].id;
        
        currentQuestionIndex++;
        if (currentQuestionIndex < quizData.length) { loadQuestion(); } 
        else {
            document.getElementById("quiz-section").style.display = "none";
            document.getElementById("final-section").style.display = "block";
            document.getElementById("final-score").innerText = score;
            document.getElementById("total-questions").innerText = quizData.length;
        }
    }

    function restartQuiz() {
        startNewQuizSession();
    }

    window.onload = function() {
        startNewQuizSession();
    };
</script>

</body>
</html>
