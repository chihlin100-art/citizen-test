<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>美國公民「全真考場模擬」口試系統</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #0f172a; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .quiz-container { background-color: #ffffff; color: #333; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); padding: 40px; width: 680px; max-width: 100%; text-align: center; }
        h2 { font-size: 22px; color: #1e3a8a; margin-bottom: 25px; line-height: 1.4; }
        
        .setup-panel { background-color: #f8fafc; border: 2px solid #e2e8f0; padding: 25px; border-radius: 10px; text-align: left; margin-bottom: 20px; color: #1e293b; display: block; }
        .setup-panel h3 { margin-top: 0; color: #0f172a; border-bottom: 2px solid #cbd5e1; padding-bottom: 12px; font-size: 18px; text-align: center; }
        
        .address-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-bottom: 15px; }
        .form-group { display: flex; flex-direction: column; }
        .form-group.full-width { grid-column: span 2; }
        .form-group label { font-weight: bold; margin-bottom: 6px; font-size: 14px; color: #334155; }
        .form-group input { padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 15px; box-sizing: border-box; width: 100%; background-color: #fff; color: #1e293b; }
        
        .officer-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 25px; margin-top: 10px; }
        .officer-card { border: 2px solid #cbd5e1; border-radius: 10px; overflow: hidden; text-align: center; cursor: pointer; transition: all 0.2s; background: white; padding-bottom: 10px; box-sizing: border-box; }
        .officer-card:hover { border-color: #3b82f6; transform: translateY(-2px); }
        .officer-card.selected { border-color: #22c55e; background-color: #f0fdf4; box-shadow: 0 0 12px rgba(34,197,94,0.4); }
        
        .avatar-container { width: 110px; height: 110px; margin: 12px auto 8px auto; border-radius: 50%; overflow: hidden; border: 2px solid #e2e8f0; background-color: #f1f5f9; }
        .officer-img { width: 100%; height: 100%; object-fit: cover; }
        .officer-name { font-size: 14px; font-weight: bold; color: #1e293b; margin-top: 4px; }
        .officer-accent { font-size: 11px; color: #64748b; margin-top: 2px; padding: 0 4px; line-height: 1.3; }

        .control-panel { background-color: #f1f5f9; padding: 15px; border-radius: 8px; margin-bottom: 20px; text-align: left; font-size: 14px; color: #475569; }
        .control-panel label { font-weight: bold; display: block; margin-bottom: 5px; }
        .speed-slider { width: 100%; margin-bottom: 5px; }
        
        .repeat-btn { background-color: #3b82f6; color: white; border: none; padding: 12px 20px; border-radius: 20px; font-size: 14px; cursor: pointer; margin-bottom: 20px; font-weight: bold; width: 100%; }
        .repeat-btn:hover { background-color: #2563eb; }
        
        .mic-btn { background-color: #ef4444; color: white; border: none; padding: 15px 30px; border-radius: 50px; font-size: 18px; cursor: pointer; font-weight: bold; margin: 15px 0; width: 100%; box-shadow: 0 4px 10px rgba(239,68,68,0.4); transition: all 0.2s; }
        .mic-btn.recording { background-color: #22c55e; box-shadow: 0 4px 10px rgba(34,197,94,0.4); }
        
        .result-box { padding: 15px; border-radius: 8px; margin: 15px 0; font-size: 16px; font-weight: bold; display: none; text-align: left; line-height: 1.5; }
        .success { background-color: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
        .error { background-color: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
        
        .action-btn { background-color: #1e293b; color: white; border: none; padding: 12px 30px; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold; margin-top: 15px; display: none; width: 100%; }
        .start-exam-btn { background-color: #2563eb; color: white; border: none; padding: 14px 30px; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: bold; margin-top: 20px; width: 100%; box-shadow: 0 4px 6px rgba(37,99,235,0.2); }
        .start-exam-btn:hover { background-color: #1d4ed8; }
        .restart-btn { background-color: #22c55e; color: white; border: none; padding: 12px 30px; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold; margin-top: 20px; }
    </style>
</head>
<body>

<div class="quiz-container">
    
    <div id="setup-section" class="setup-panel">
        <h3>選擇你的指定面試官 (Select Your Interviewer)</h3>
        
        <div class="officer-grid">
            <div class="officer-card selected" onclick="selectOfficer('white-female', this)">
                <div class="avatar-container">
                    <img src="https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?q=80&w=200&auto=format&fit=crop" class="officer-img" alt="Officer Emily">
                </div>
                <div class="officer-name">Officer Emily</div>
                <div class="officer-accent">白人女性<br>(美式標準音)</div>
            </div>
            <div class="officer-card" onclick="selectOfficer('black-male', this)">
                <div class="avatar-container">
                    <img src="https://images.unsplash.com/photo-1560250097-0b93528c311a?q=80&w=200&auto=format&fit=crop" class="officer-img" alt="Officer Marcus">
                </div>
                <div class="officer-name">Officer Marcus</div>
                <div class="officer-accent">黑人男性<br>(Cary現場官員音)</div>
            </div>
            <div class="officer-card" onclick="selectOfficer('indian-female', this)">
                <div class="avatar-container">
                    <img src="https://images.unsplash.com/photo-1580489944761-15a19d654956?q=80&w=200&auto=format&fit=crop" class="officer-img" alt="Officer Sofia">
                </div>
                <div class="officer-name">Officer Sofia</div>
                <div class="officer-accent">印度裔女性<br>(Apex新移民音)</div>
            </div>
            <div class="officer-card" onclick="selectOfficer('latino-male', this)">
                <div class="avatar-container">
                    <img src="https://images.unsplash.com/photo-1519085360753-af0119f7cbe7?q=80&w=200&auto=format&fit=crop" class="officer-img" alt="Officer Diego">
                </div>
                <div class="officer-name">Officer Diego</div>
                <div class="officer-accent">南美洲男性<br>(西語平舌音)</div>
            </div>
        </div>

        <label style="font-weight: bold; display: block; margin-bottom: 12px; font-size: 14px; color: #0f172a; border-top: 1px solid #cbd5e1; padding-top: 15px;">應試者基本通訊資料 (Applicant Address)：</label>
        <div class="address-grid">
            <div class="form-group full-width">
                <label>姓名 (Full Name)：</label>
                <input type="text" id="setup-name" value="Jeffrey">
            </div>
            <div class="form-group full-width">
                <label>地址 (Street Address)：</label>
                <input type="text" id="setup-address" value="120 Bellevue Ave">
            </div>
            <div class="form-group">
                <label>城市 (City)：</label>
                <input type="text" id="setup-city" value="Cary">
            </div>
            <div class="form-group">
                <label>州 (State)：</label>
                <input type="text" id="setup-state" value="North Carolina">
            </div>
            <div class="form-group full-width">
                <label>ZIP Code：</label>
                <input type="text" id="setup-zip" value="27511">
            </div>
        </div>
        
        <button class="start-exam-btn" onclick="confirmSetupAndStart()">確認資料，開始模擬面試 🚀</button>
    </div>

    <div id="quiz-section" style="display: none;">
        <div id="progress" style="font-size: 14px; color: #64748b; text-align: left; margin-bottom: 10px;"></div>
        
        <div class="control-panel">
            <div id="current-officer-display" style="font-weight: bold; color: #1e3a8a; margin-bottom: 8px; font-size: 15px;"></div>
            <label for="speed">官員語速調整 (Speech Speed): <span id="speed-val">0.85</span>x</label>
            <input type="range" id="speed" class="speed-slider" min="0.5" max="1.2" step="0.05" value="0.85" oninput="updateSpeed(this.value)">
        </div>

        <button class="repeat-btn" onclick="speakQuestion(true)">
            🙋‍♂️ 沒聽清？請官員再唸一次 (Can you please repeat that?)
        </button>
        
        <h2 id="question-text">題目載入中...</h2>
        
        <button id="mic-btn" class="mic-btn" onclick="toggleListening()">🎤 按一下開始回答 (Speak Now)</button>
        
        <div id="user-speech" style="font-style: italic; color: #475569; margin: 10px 0; min-height: 24px;"></div>
        <div id="similarity-score" style="font-size: 13px; color: #64748b; margin-bottom: 10px;"></div>
        
        <div id="result-box" class="result-box"></div>
        
        <div style="margin-top: 15px;">
            <button id="next-btn" class="action-btn" onclick="nextQuestion()">下一題 (Next)</button>
        </div>
    </div>
    
    <div id="final-section" style="display: none; color: #333;">
        <h2>測驗結束！</h2>
        <p style="font-size: 18px;">順利通過題數：<span id="final-score" style="color: #22c55e; font-weight: bold;">0</span> / <span id="total-questions">0</span></p>
        <button class="restart-btn" onclick="restartQuiz()">🔄 再試一次 (Restart)</button>
    </div>
</div>

<script>
    const rawQuizData = [
      { id: 1, question: "What is the supreme law of the land?", keywords: ["constitution"], answer: "The Constitution" },
      { id: 2, question: "What does the Constitution do?", keywords: ["sets up", "defines", "protects"], answer: "sets up the government / defines the government / protects basic rights of Americans" },
      { id: 3, question: "The idea of self-government is in the first three words of the Constitution. What are these words?", keywords: ["we the people"], answer: "We the People" },
      { id: 4, question: "What is an amendment?", keywords: ["change", "addition"], answer: "a change (to the Constitution) / an addition (to the Constitution)" },
      { id: 5, question: "What do we call the first ten amendments to the Constitution?", keywords: ["bill of rights"], answer: "the Bill of Rights" },
      { id: 11, question: "What is the economic system in the United States?", keywords: ["capitalist", "market"], answer: "capitalist economy / market economy" }
    ];

    let quizData = [];
    let currentQuestionIndex = 0;
    let score = 0;
    let recognition;
    let isRecording = false;
    let currentSpeed = 0.85;

    let selectedOfficerType = 'white-female';
    const officerMeta = {
        'white-female': { name: "Officer Emily (白人女性)", lang: "en-US", nameHint: "Zira" },
        'black-male': { name: "Officer Marcus (黑人男性)", lang: "en-US", nameHint: "David" },
        'indian-female': { name: "Officer Sofia (印度裔女性)", lang: "en-IN", nameHint: "Heera" },
        'latino-male': { name: "Officer Diego (南美洲男性)", lang: "en-ZA", nameHint: "Sabina" }
    };

    function selectOfficer(type, element) {
        selectedOfficerType = type;
        document.querySelectorAll('.officer-card').forEach(card => card.classList.remove('selected'));
        element.classList.add('selected');
    }

    function confirmSetupAndStart() {
        document.getElementById("current-officer-display").innerText = `當前執考官：${officerMeta[selectedOfficerType].name}`;
        document.getElementById("setup-section").style.display = "none";
        document.getElementById("quiz-section").style.display = "block";
        startNewQuizSession();
    }

    function startNewQuizSession() {
        quizData = [...rawQuizData];
        currentQuestionIndex = 0;
        score = 0;
        loadQuestion();
    }

    function loadQuestion() {
        document.getElementById("result-box").style.display = "none"; 
        document.getElementById("next-btn").style.display = "none";
        document.getElementById("user-speech").innerText = ""; 
        document.getElementById("similarity-score").innerText = "";
        
        let currentQuestion = quizData[currentQuestionIndex];
        document.getElementById("progress").innerText = `題目進度: ${currentQuestionIndex + 1} / ${quizData.length}`;
        document.getElementById("question-text").innerText = currentQuestion.question;
        setTimeout(() => { speakQuestion(); }, 400);
    }

    function speakQuestion() {
        if (!quizData || quizData.length === 0) return;
        window.speechSynthesis.cancel();
        let utterance = new SpeechSynthesisUtterance(quizData[currentQuestionIndex].question);
        utterance.lang = officerMeta[selectedOfficerType].lang;
        utterance.rate = currentSpeed;
        window.speechSynthesis.speak(utterance);
    }

    function toggleListening() {
        if (isRecording) { recognition.stop(); } else { recognition.start(); }
    }

    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition();
        recognition.lang = 'en-US';
        recognition.onstart = function() {
            isRecording = true;
            document.getElementById("mic-btn").innerText = "🛑 官員正在聽... (Listening)";
            document.getElementById("mic-btn").classList.add("recording");
        };
        recognition.onend = function() {
            isRecording = false;
            document.getElementById("mic-btn").innerText = "🎤 按一下開始回答 (Speak Now)";
            document.getElementById("mic-btn").classList.remove("recording");
        };
        recognition.onresult = function(event) {
            const userSpeech = event.results[0][0].transcript.toLowerCase();
            document.getElementById("user-speech").innerHTML = `你回答的是：<strong>"${userSpeech}"</strong>`;
            document.getElementById("result-box").style.display = "block";
            document.getElementById("result-box").className = "result-box success";
            document.getElementById("result-box").innerHTML = `已接收語音回答。`;
            document.getElementById("next-btn").style.display = "inline-block";
        };
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < quizData.length) { loadQuestion(); } 
        else {
            document.getElementById("quiz-section").style.display = "none";
            document.getElementById("final-section").style.display = "block";
            document.getElementById("final-score").innerText = score;
            document.getElementById("total-questions").innerText = quizData.length;
        }
    }

    function restartQuiz() {
        document.getElementById("setup-section").style.display = "block";
        document.getElementById("quiz-section").style.display = "none";
        document.getElementById("final-section").style.display = "none";
    }

    window.onload = function() {
        // 本地啟動，死鎖強制第一頁
        document.getElementById("setup-section").style.display = "block";
        document.getElementById("quiz-section").style.display = "none";
        document.getElementById("final-section").style.display = "none";
    };
</script>

</body>
</html>
